<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BioGenius · Join the Community</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <style>
        /* ============================================================
           ROOT VARIABLES
           ============================================================ */
        :root {
            --primary: #0a8f7a;
            --primary-light: #1db3a0;
            --primary-dark: #065a4f;
            --green: #4caf68;
            --green-light: #8fdc9b;
            --bg-deep: #071412;
            --text-primary: #ecfbf5;
            --text-secondary: rgba(200, 230, 220, 0.75);
            --text-muted: rgba(200, 230, 220, 0.35);
            --surface: rgba(255, 255, 255, 0.04);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --shadow-card: 0 30px 80px rgba(0, 0, 0, 0.55);
            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-sm: 12px;
            --transition-smooth: cubic-bezier(0.23, 1, 0.32, 1);
            --transition-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ============================================================
           RESET & BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-deep);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================================
           ANIMATED BACKGROUND
           ============================================================ */
        .bg-universe {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: var(--bg-deep);
        }

        .bg-universe .gradient-layer {
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 15% 15%, rgba(10, 143, 122, 0.20) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 80%, rgba(76, 175, 104, 0.10) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(7, 20, 18, 0.96) 0%, #071412 100%);
        }

        .bg-universe .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            animation: orbDrift 20s ease-in-out infinite alternate;
        }
        .bg-universe .orb--1 {
            width: 500px;
            height: 500px;
            top: -200px;
            right: -150px;
            background: rgba(10, 143, 122, 0.18);
        }
        .bg-universe .orb--2 {
            width: 400px;
            height: 400px;
            bottom: -150px;
            left: -100px;
            background: rgba(76, 175, 104, 0.10);
        }
        .bg-universe .orb--3 {
            width: 250px;
            height: 250px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(126, 221, 176, 0.04);
            animation-delay: 8s;
        }

        @keyframes orbDrift {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -40px) scale(1.05);
            }
            66% {
                transform: translate(-20px, 30px) scale(0.95);
            }
            100% {
                transform: translate(15px, 20px) scale(1.02);
            }
        }

        .bg-universe .noise-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            background-size: 260px 260px;
            opacity: 0.5;
            mix-blend-mode: overlay;
        }

        /* Floating particles — minimal */
        .particles {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(126, 221, 176, 0.15);
            border-radius: 50%;
            animation: particleRise 22s linear infinite;
        }
        .particle:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
            width: 5px;
            height: 5px;
        }
        .particle:nth-child(2) {
            left: 25%;
            animation-delay: 3s;
        }
        .particle:nth-child(3) {
            left: 45%;
            animation-delay: 5s;
            width: 6px;
            height: 6px;
            opacity: 0.10;
        }
        .particle:nth-child(4) {
            left: 60%;
            animation-delay: 2s;
        }
        .particle:nth-child(5) {
            left: 78%;
            animation-delay: 7s;
            width: 4px;
            height: 4px;
        }
        .particle:nth-child(6) {
            left: 90%;
            animation-delay: 4s;
            width: 5px;
            height: 5px;
        }
        .particle:nth-child(7) {
            left: 35%;
            animation-delay: 9s;
            width: 7px;
            height: 7px;
            opacity: 0.08;
        }
        .particle:nth-child(8) {
            left: 70%;
            animation-delay: 6s;
            width: 3px;
            height: 3px;
        }

        @keyframes particleRise {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            85% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        /* ============================================================
           MAIN CONTAINER
           ============================================================ */
        .form-wrapper {
            width: 100%;
            max-width: 520px;
            position: relative;
            z-index: 1;
            animation: wrapperEntrance 0.8s var(--transition-bounce) both;
        }

        @keyframes wrapperEntrance {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ============================================================
           FORM CARD — GLASS
           ============================================================ */
        .form-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(36px) saturate(1.4);
            -webkit-backdrop-filter: blur(36px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-lg);
            padding: 42px 38px 38px;
            box-shadow:
                var(--shadow-card),
                0 0 0 1px rgba(255, 255, 255, 0.02),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: transform 0.5s var(--transition-smooth),
                box-shadow 0.5s var(--transition-smooth),
                border-color 0.5s var(--transition-smooth);
            position: relative;
        }

        .form-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: var(--radius-lg);
            padding: 1px;
            background: linear-gradient(135deg,
                    rgba(126, 221, 176, 0),
                    rgba(126, 221, 176, 0.05),
                    rgba(10, 143, 122, 0.10),
                    rgba(126, 221, 176, 0.05),
                    rgba(126, 221, 176, 0));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            transition: opacity 0.5s ease;
            opacity: 0.3;
        }

        .form-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-lg);
            background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%),
                    rgba(126, 221, 176, 0.04),
                    transparent 60%);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .form-card:hover::after {
            opacity: 1;
        }
        .form-card:hover {
            border-color: rgba(126, 221, 176, 0.08);
            box-shadow:
                0 40px 100px rgba(0, 0, 0, 0.50),
                0 0 0 1px rgba(126, 221, 176, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }
        .form-card:hover::before {
            opacity: 0.8;
            background: linear-gradient(135deg,
                    rgba(126, 221, 176, 0.08),
                    rgba(10, 143, 122, 0.15),
                    rgba(126, 221, 176, 0.08));
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header .icon-ring {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(10, 143, 122, 0.20), rgba(6, 90, 79, 0.12));
            border: 2px solid rgba(126, 221, 176, 0.08);
            margin-bottom: 16px;
            font-size: 32px;
            color: #7eddb0;
            transition: all 0.5s var(--transition-bounce);
            position: relative;
        }

        .form-card:hover .form-header .icon-ring {
            transform: scale(1.05) rotate(-3deg);
            border-color: rgba(126, 221, 176, 0.18);
            box-shadow: 0 0 50px rgba(126, 221, 176, 0.05);
        }

        .form-header .icon-ring .pulse-ring {
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            border: 1px solid rgba(126, 221, 176, 0.05);
            animation: pulseRing 3s ease-in-out infinite;
        }

        @keyframes pulseRing {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.10);
                opacity: 0;
            }
        }

        .form-header h1 {
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 30px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.25);
            line-height: 1.2;
        }

        .form-header h1 .highlight {
            background: linear-gradient(135deg, #7eddb0, #4caf68);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-header .sub {
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 6px;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        /* ============================================================
           PHOTO UPLOAD — CLEAN & MODERN
           ============================================================ */
        .photo-section {
            text-align: center;
            margin-bottom: 22px;
            padding: 20px 16px 16px;
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.02);
            border: 1.5px dashed rgba(255, 255, 255, 0.06);
            transition: all 0.4s var(--transition-smooth);
            position: relative;
        }

        .photo-section:hover {
            background: rgba(255, 255, 255, 0.035);
            border-color: rgba(126, 221, 176, 0.08);
        }
        .photo-section.drag-over {
            border-color: rgba(126, 221, 176, 0.25);
            background: rgba(126, 221, 176, 0.04);
            transform: scale(1.002);
        }

        .photo-section .photo-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .photo-section .photo-label i {
            color: #7eddb0;
            margin-right: 6px;
        }

        .photo-upload-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        #preview {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid rgba(126, 221, 176, 0.10);
            display: none;
            transition: all 0.5s var(--transition-bounce);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            background: rgba(255, 255, 255, 0.02);
        }

        #preview.show {
            display: block;
            animation: previewPop 0.5s var(--transition-bounce);
        }

        @keyframes previewPop {
            0% {
                transform: scale(0.6) rotate(-8deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .photo-upload-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 24px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.35s var(--transition-smooth);
        }

        .photo-upload-btn:hover {
            background: rgba(10, 143, 122, 0.10);
            border-color: rgba(126, 221, 176, 0.15);
            color: var(--text-primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(10, 143, 122, 0.06);
        }

        .photo-upload-btn i {
            color: #7eddb0;
            font-size: 15px;
            transition: transform 0.3s var(--transition-smooth);
        }

        .photo-upload-btn:hover i {
            transform: scale(1.1) rotate(-4deg);
        }

        #photo {
            display: none;
        }

        .photo-hint {
            font-size: 9px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* ============================================================
           FORM FIELDS — MODERN & CLEAN
           ============================================================ */
        .form-group {
            margin-bottom: 18px;
            position: relative;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 5px;
            letter-spacing: 0.3px;
            transition: color 0.3s ease;
        }

        .form-group label i {
            color: #7eddb0;
            font-size: 13px;
            width: 18px;
            transition: all 0.3s var(--transition-smooth);
        }

        .form-group:focus-within label i {
            color: #b5f0d4;
            transform: scale(1.1) rotate(-3deg);
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-sm);
            outline: none;
            background: rgba(255, 255, 255, 0.025);
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.35s var(--transition-smooth);
            font-family: "Inter", sans-serif;
        }

        .form-group input::placeholder {
            color: rgba(200, 230, 220, 0.18);
            font-weight: 300;
        }

        .form-group input:focus {
            border-color: rgba(126, 221, 176, 0.20);
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 0 0 4px rgba(126, 221, 176, 0.02);
            transform: translateY(-1px);
        }

        .form-group input:hover {
            border-color: rgba(255, 255, 255, 0.08);
        }

        .form-group .input-shimmer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 2px;
            background: linear-gradient(90deg, #7eddb0, #4caf68);
            border-radius: 0 0 4px 4px;
            transition: width 0.5s var(--transition-smooth);
        }

        .form-group:focus-within .input-shimmer {
            width: 100%;
        }

        /* ============================================================
           SUBMIT BUTTON
           ============================================================ */
        .submit-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, #1a9b85, #08766c);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            font-family: "Inter", sans-serif;
            cursor: pointer;
            transition: all 0.4s var(--transition-smooth);
            position: relative;
            overflow: hidden;
            box-shadow:
                0 10px 32px rgba(10, 143, 122, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: 0.3px;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, #26b396, #0e8a7a);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow:
                0 16px 44px rgba(10, 143, 122, 0.30),
                inset 0 1px 0 rgba(255, 255, 255, 0.10);
        }

        .submit-btn:hover:not(:disabled)::before {
            opacity: 1;
        }

        .submit-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .submit-btn i,
        .submit-btn span {
            position: relative;
            z-index: 1;
        }

        .submit-btn i {
            font-size: 17px;
            transition: transform 0.3s var(--transition-smooth);
        }

        .submit-btn:hover:not(:disabled) i {
            transform: rotate(-5deg) scale(1.05);
        }

        .submit-btn:disabled {
            background: rgba(255, 255, 255, 0.06);
            box-shadow: none;
            cursor: not-allowed;
            color: rgba(200, 230, 220, 0.30);
            transform: none !important;
        }

        .submit-btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.20);
            transform: scale(0);
            animation: rippleAnim 0.6s ease-out forwards;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* ============================================================
           MESSAGE
           ============================================================ */
        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: 600;
            font-size: 13px;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            transition: all 0.4s var(--transition-smooth);
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #message.success {
            color: #7eddb0;
            background: rgba(126, 221, 176, 0.06);
            border: 1px solid rgba(126, 221, 176, 0.06);
            animation: msgPop 0.4s var(--transition-bounce);
        }

        #message.error {
            color: #f87171;
            background: rgba(248, 113, 113, 0.05);
            border: 1px solid rgba(248, 113, 113, 0.06);
            animation: msgPop 0.4s var(--transition-bounce);
        }

        @keyframes msgPop {
            0% {
                transform: scale(0.95);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ============================================================
           SUCCESS CONFETTI
           ============================================================ */
        .success-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-overlay .confetti-piece {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 2px;
            opacity: 0;
            animation: confettiFall 3s ease-in forwards;
        }

        @keyframes confettiFall {
            0% {
                opacity: 1;
                transform: translateY(-20vh) rotate(0deg) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(110vh) rotate(720deg) scale(0.2);
            }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 640px) {
            body {
                padding: 12px;
            }
            .form-card {
                padding: 28px 20px 24px;
                border-radius: 22px;
            }
            .form-header h1 {
                font-size: 26px;
            }
            .form-header .icon-ring {
                width: 62px;
                height: 62px;
                font-size: 26px;
            }
            .form-group input {
                padding: 12px 14px;
                font-size: 13px;
            }
            .submit-btn {
                padding: 14px;
                font-size: 14px;
            }
            .photo-section {
                padding: 16px 12px;
            }
            #preview {
                width: 84px;
                height: 84px;
            }
            .form-card::before,
            .form-card::after {
                border-radius: 22px;
            }
        }

        @media (max-width: 400px) {
            .form-card {
                padding: 22px 14px 18px;
                border-radius: 18px;
            }
            .form-header h1 {
                font-size: 22px;
            }
            .form-header .icon-ring {
                width: 52px;
                height: 52px;
                font-size: 22px;
                margin-bottom: 12px;
            }
            .form-group input {
                padding: 10px 12px;
                font-size: 12px;
            }
            .submit-btn {
                padding: 12px;
                font-size: 13px;
            }
            #preview {
                width: 72px;
                height: 72px;
            }
            .photo-upload-btn {
                padding: 8px 18px;
                font-size: 12px;
            }
            .form-card::before,
            .form-card::after {
                border-radius: 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .bg-universe .orb,
            .particle {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
            .form-card,
            .form-card * {
                transition-duration: 0.01ms !important;
            }
            #preview.show {
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- ============================================================
    ANIMATED BACKGROUND
    ============================================================ -->
    <div class="bg-universe">
        <div class="gradient-layer"></div>
        <div class="orb orb--1"></div>
        <div class="orb orb--2"></div>
        <div class="orb orb--3"></div>
        <div class="noise-overlay"></div>
    </div>

    <!-- Floating Particles -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- ============================================================
    MAIN FORM
    ============================================================ -->
    <div class="form-wrapper">

        <div class="form-card" id="formCard">

            <!-- Header -->
            <div class="form-header">
                <div class="icon-ring">
                    <span class="pulse-ring"></span>
                    <i class="fas fa-dna"></i>
                </div>
                <h1>Join <span class="highlight">BioGenius</span></h1>
                <p class="sub">Become part of the biotechnology community</p>
            </div>

            <!-- Form -->
            <form id="memberForm" novalidate>

                <!-- Photo Upload -->
                <div class="photo-section" id="photoSection">
                    <span class="photo-label">
                        <i class="fas fa-camera"></i> Profile Photo
                    </span>
                    <div class="photo-upload-wrap">
                        <img id="preview" alt="Profile preview" />
                        <label class="photo-upload-btn" for="photo" id="uploadLabel">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <span>Choose Photo</span>
                        </label>
                        <input type="file" id="photo" accept="image/png,image/jpeg,image/webp" required />
                        <span class="photo-hint">PNG, JPG · Max 2MB</span>
                    </div>
                </div>

                <!-- Name -->
                <div class="form-group">
                    <label for="name"><i class="fas fa-user"></i> Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required autocomplete="name" />
                    <div class="input-shimmer"></div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="email" placeholder="Enter your university email" required autocomplete="email" />
                    <div class="input-shimmer"></div>
                </div>

                <!-- Department -->
                <div class="form-group">
                    <label for="department"><i class="fas fa-graduation-cap"></i> Department / Branch</label>
                    <input type="text" id="department" placeholder="e.g. Biotechnology" required />
                    <div class="input-shimmer"></div>
                </div>

                <!-- Year -->
                <div class="form-group">
                    <label for="year"><i class="fas fa-calendar-alt"></i> Year / Semester</label>
                    <input type="text" id="year" placeholder="e.g. 2nd Year" required />
                    <div class="input-shimmer"></div>
                </div>

                <!-- Submit -->
                <button type="submit" class="submit-btn" id="registerBtn">
                    <i class="fas fa-leaf"></i>
                    <span>Register</span>
                </button>

                <div id="message"></div>

            </form>

        </div>

    </div>

    <!-- ============================================================
    FIREBASE + CLOUDINARY
    ============================================================ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCuYhCw8NdMB0Nu5p00L2HxOJfOCsEoHwo",
            authDomain: "biogenius-club.firebaseapp.com",
            projectId: "biogenius-club",
            storageBucket: "biogenius-club.firebasestorage.app",
            messagingSenderId: "32774064333",
            appId: "1:32774064333:web:cd43095a382f4949af8184"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ============================================================
        // CLOUDINARY SETTINGS
        // ============================================================
        const CLOUD_NAME = "jdada6qn";
        const UPLOAD_PRESET = "biogenius_members";

        // ============================================================
        // DOM REFS
        // ============================================================
        const form = document.getElementById("memberForm");
        const photoInput = document.getElementById("photo");
        const preview = document.getElementById("preview");
        const registerBtn = document.getElementById("registerBtn");
        const message = document.getElementById("message");
        const formCard = document.getElementById("formCard");
        const photoSection = document.getElementById("photoSection");

        // ============================================================
        // 3D TILT
        // ============================================================
        formCard.addEventListener("mousemove", function(e) {
            const rect = this.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;

            this.style.setProperty("--mx", x + "%");
            this.style.setProperty("--my", y + "%");

            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const deltaX = (e.clientX - centerX) / centerX;
            const deltaY = (e.clientY - centerY) / centerY;
            const rotateY = Math.max(-2.5, Math.min(2.5, deltaX * 2.5));
            const rotateX = Math.max(-2.5, Math.min(2.5, -deltaY * 2.5));

            this.style.transform =
                `rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-4px) scale(1.005)`;
        });

        formCard.addEventListener("mouseleave", function() {
            this.style.transform = "rotateX(0deg) rotateY(0deg) translateY(0px) scale(1)";
        });

        // ============================================================
        // PHOTO PREVIEW
        // ============================================================
        photoInput.addEventListener("change", function() {
            const file = this.files[0];
            if (!file) return;

            if (file.size > 2 * 1024 * 1024) {
                alert("Please select an image smaller than 2 MB.");
                this.value = "";
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.classList.add("show");
                document.querySelector("#uploadLabel span").textContent = "Change Photo";
            };
            reader.readAsDataURL(file);
        });

        // ============================================================
        // DRAG & DROP
        // ============================================================
        photoSection.addEventListener("dragover", function(e) {
            e.preventDefault();
            this.classList.add("drag-over");
        });

        photoSection.addEventListener("dragleave", function(e) {
            e.preventDefault();
            this.classList.remove("drag-over");
        });

        photoSection.addEventListener("drop", function(e) {
            e.preventDefault();
            this.classList.remove("drag-over");
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                photoInput.files = files;
                photoInput.dispatchEvent(new Event("change"));
            }
        });

        // ============================================================
        // RIPPLE EFFECT
        // ============================================================
        registerBtn.addEventListener("click", function(e) {
            const rect = this.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const ripple = document.createElement("span");
            ripple.className = "ripple";
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = size + "px";
            ripple.style.left = x - size / 2 + "px";
            ripple.style.top = y - size / 2 + "px";
            this.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });

        // ============================================================
        // CONFETTI
        // ============================================================
        function fireConfetti() {
            const overlay = document.createElement("div");
            overlay.className = "success-overlay";
            document.body.appendChild(overlay);

            const colors = ["#7eddb0", "#4caf68", "#f0c040", "#ff6b6b", "#4dabf7", "#da77f2"];
            for (let i = 0; i < 60; i++) {
                const piece = document.createElement("div");
                piece.className = "confetti-piece";
                const size = 4 + Math.random() * 7;
                piece.style.width = size + "px";
                piece.style.height = size * (0.4 + Math.random() * 0.8) + "px";
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.left = Math.random() * 100 + "%";
                piece.style.top = Math.random() * 20 + "%";
                piece.style.animationDuration = 2 + Math.random() * 2.5 + "s";
                piece.style.animationDelay = Math.random() * 1.2 + "s";
                piece.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
                overlay.appendChild(piece);
            }
            setTimeout(() => overlay.remove(), 3500);
        }

        // ============================================================
        // FORM SUBMIT
        // ============================================================
        form.addEventListener("submit", async function(e) {
            e.preventDefault();

            message.textContent = "";
            message.className = "";

            const file = photoInput.files[0];
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const department = document.getElementById("department").value.trim();
            const year = document.getElementById("year").value.trim();

            if (!file) {
                message.textContent = "❌ Please select a profile photo.";
                message.className = "error";
                return;
            }
            if (!name || !email || !department || !year) {
                message.textContent = "❌ Please fill in all fields.";
                message.className = "error";
                return;
            }

            try {
                registerBtn.disabled = true;
                registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Uploading...</span>';

                const cloudinaryData = new FormData();
                cloudinaryData.append("file", file);
                cloudinaryData.append("upload_preset", UPLOAD_PRESET);

                const uploadResponse = await fetch(
                    `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                        method: "POST",
                        body: cloudinaryData
                    }
                );

                if (!uploadResponse.ok) throw new Error("Photo upload failed.");

                const uploadResult = await uploadResponse.json();
                const photoURL = uploadResult.secure_url;

                registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Submitting...</span>';

                await addDoc(collection(db, "members"), {
                    name,
                    email,
                    department,
                    year,
                    photoURL,
                    status: "pending",
                    createdAt: serverTimestamp()
                });

                message.textContent = "✅ Registration submitted! Waiting for admin approval.";
                message.className = "success";

                fireConfetti();

                form.reset();
                preview.classList.remove("show");
                preview.src = "";
                document.querySelector("#uploadLabel span").textContent = "Choose Photo";

            } catch (error) {
                console.error(error);
                message.textContent = "❌ Something went wrong. Please try again.";
                message.className = "error";
            } finally {
                registerBtn.disabled = false;
                registerBtn.innerHTML = '<i class="fas fa-leaf"></i><span>Register</span>';
            }
        });

        console.log("✅ BioGenius — Modern registration page loaded!");
    </script>

</body>
</html>
