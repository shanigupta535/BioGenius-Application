<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join BioGenius Club</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* ============================================================
           ROOT VARIABLES
           ============================================================ */
        :root {
            --primary: #087f70;
            --primary-dark: #065a4f;
            --primary-light: #0ea58f;
            --green: #4caf68;
            --green-light: #8fdc9b;
            --gold: #f0c040;
            --gold-light: #ffe066;
        }

        /* ============================================================
           RESET & BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a1a18;
            padding: 30px;
            position: relative;
            overflow-x: hidden;
        }

        /* ============================================================
           ANIMATED BACKGROUND
           ============================================================ */
        .bg-wall {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: #0a1a18;
        }
        .bg-wall .bg-gradient {
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(8, 127, 112, 0.30) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 80%, rgba(76, 175, 104, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(10, 30, 28, 0.95) 0%, #0a1a18 100%);
        }

        .bg-wall .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            pointer-events: none;
            animation: orbFloat 12s ease-in-out infinite alternate;
        }
        .bg-wall .orb-1 {
            width: 600px;
            height: 600px;
            top: -200px;
            right: -150px;
            background: rgba(8, 127, 112, 0.25);
            animation-delay: 0s;
        }
        .bg-wall .orb-2 {
            width: 500px;
            height: 500px;
            bottom: -150px;
            left: -100px;
            background: rgba(76, 175, 104, 0.15);
            animation-delay: 4s;
        }
        .bg-wall .orb-3 {
            width: 300px;
            height: 300px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(126, 221, 176, 0.06);
            animation-delay: 8s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.05); }
            66% { transform: translate(-20px, 30px) scale(0.95); }
            100% { transform: translate(20px, 20px) scale(1.02); }
        }

        .bg-wall .noise {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            background-size: 300px 300px;
            opacity: 0.5;
            mix-blend-mode: overlay;
        }

        /* ============================================================
           FLOATING PARTICLES (CSS only)
           ============================================================ */
        .particles {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(126, 221, 176, 0.25);
            border-radius: 50%;
            animation: particleFloat 20s linear infinite;
        }
        .particle:nth-child(1) { left: 10%; animation-delay: 0s; width: 6px; height: 6px; }
        .particle:nth-child(2) { left: 20%; animation-delay: 2s; }
        .particle:nth-child(3) { left: 35%; animation-delay: 4s; width: 8px; height: 8px; opacity: 0.15; }
        .particle:nth-child(4) { left: 50%; animation-delay: 1s; }
        .particle:nth-child(5) { left: 65%; animation-delay: 3s; width: 5px; height: 5px; }
        .particle:nth-child(6) { left: 78%; animation-delay: 5s; width: 7px; height: 7px; opacity: 0.15; }
        .particle:nth-child(7) { left: 88%; animation-delay: 2.5s; }
        .particle:nth-child(8) { left: 45%; animation-delay: 6s; width: 9px; height: 9px; opacity: 0.1; }
        .particle:nth-child(9) { left: 72%; animation-delay: 3.5s; width: 3px; height: 3px; }
        .particle:nth-child(10) { left: 92%; animation-delay: 4.5s; width: 5px; height: 5px; }

        @keyframes particleFloat {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* ============================================================
           MAIN CONTAINER — 3D PERSPECTIVE
           ============================================================ */
        .form-wrapper {
            width: 100%;
            max-width: 560px;
            perspective: 1200px;
            position: relative;
            z-index: 1;
        }

        .form-box {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(32px) saturate(1.4);
            -webkit-backdrop-filter: blur(32px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 44px 40px 40px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.50),
                0 0 0 1px rgba(255, 255, 255, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transform: rotateX(2deg) rotateY(-1deg);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
        }

        /* 3D glow border on hover */
        .form-box::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 32px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(126, 221, 176, 0), rgba(126, 221, 176, 0.08), rgba(8, 127, 112, 0.15), rgba(126, 221, 176, 0.08), rgba(126, 221, 176, 0));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            transition: all 0.6s ease;
            opacity: 0.5;
        }

        .form-box::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 32px;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(126, 221, 176, 0.06), transparent 60%);
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }

        .form-box:hover::after {
            opacity: 1;
        }

        .form-box:hover {
            transform: rotateX(0deg) rotateY(0deg) translateY(-6px) scale(1.01);
            border-color: rgba(126, 221, 176, 0.12);
            box-shadow:
                0 40px 100px rgba(0, 0, 0, 0.55),
                0 0 0 1px rgba(126, 221, 176, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .form-box:hover::before {
            opacity: 1;
            background: linear-gradient(135deg, rgba(126, 221, 176, 0.15), rgba(8, 127, 112, 0.25), rgba(126, 221, 176, 0.15));
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header .icon-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(8, 127, 112, 0.30), rgba(6, 90, 79, 0.20));
            border: 2px solid rgba(126, 221, 176, 0.12);
            margin-bottom: 16px;
            font-size: 36px;
            color: #7eddb0;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
        }

        .form-header .icon-wrap::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: radial-gradient(circle at center, rgba(126, 221, 176, 0.10), transparent 70%);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .form-box:hover .form-header .icon-wrap::after {
            opacity: 1;
        }

        .form-box:hover .form-header .icon-wrap {
            transform: scale(1.06) rotate(-4deg);
            border-color: rgba(126, 221, 176, 0.25);
            box-shadow: 0 0 40px rgba(126, 221, 176, 0.08);
        }

        .form-header h1 {
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 32px;
            font-weight: 800;
            color: #ecfbf5;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.25);
        }

        .form-header h1 span {
            color: #7eddb0;
        }

        .form-header .subtitle {
            color: rgba(200, 230, 220, 0.65);
            font-size: 14px;
            margin-top: 6px;
            font-weight: 400;
        }

        /* ============================================================
           PHOTO UPLOAD
           ============================================================ */
        .photo-section {
            text-align: center;
            margin-bottom: 22px;
            padding: 20px 16px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.06);
            transition: all 0.4s ease;
            position: relative;
        }

        .photo-section:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(126, 221, 176, 0.12);
        }

        .photo-section .photo-label {
            font-size: 13px;
            font-weight: 600;
            color: rgba(200, 230, 220, 0.70);
            display: block;
            margin-bottom: 12px;
        }

        .photo-section .photo-label i {
            color: #7eddb0;
            margin-right: 8px;
        }

        .photo-upload-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        #preview {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid rgba(126, 221, 176, 0.15);
            display: none;
            transition: all 0.4s ease;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.30);
        }

        #preview.show {
            display: block;
            animation: previewPop 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes previewPop {
            0% { transform: scale(0.7) rotate(-8deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .photo-upload-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 24px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(200, 230, 220, 0.70);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
        }

        .photo-upload-btn:hover {
            background: rgba(8, 127, 112, 0.15);
            border-color: rgba(126, 221, 176, 0.20);
            color: #ecfbf5;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(8, 127, 112, 0.10);
        }

        .photo-upload-btn i {
            color: #7eddb0;
            font-size: 16px;
            transition: transform 0.3s ease;
        }

        .photo-upload-btn:hover i {
            transform: scale(1.1) rotate(-4deg);
        }

        #photo {
            display: none;
        }

        .photo-hint {
            font-size: 10px;
            color: rgba(200, 230, 220, 0.30);
            margin-top: 4px;
            letter-spacing: 0.3px;
        }

        /* ============================================================
           FORM FIELDS
           ============================================================ */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: rgba(200, 230, 220, 0.75);
            margin-bottom: 6px;
            transition: color 0.3s ease;
        }

        .form-group label i {
            color: #7eddb0;
            font-size: 14px;
            width: 18px;
            transition: all 0.3s ease;
        }

        .form-group:hover label i {
            transform: scale(1.1);
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            outline: none;
            background: rgba(255, 255, 255, 0.04);
            color: #ecfbf5;
            font-size: 14px;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            font-family: "Inter", sans-serif;
        }

        .form-group input::placeholder {
            color: rgba(200, 230, 220, 0.25);
        }

        .form-group input:focus {
            border-color: rgba(126, 221, 176, 0.30);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 4px rgba(126, 221, 176, 0.04), inset 0 0 0 1px rgba(126, 221, 176, 0.05);
            transform: translateY(-1px);
        }

        .form-group input:focus + label {
            color: #7eddb0;
        }

        .form-group input:hover {
            border-color: rgba(255, 255, 255, 0.10);
        }

        /* Input focus glow */
        .form-group:focus-within label i {
            color: #b5f0d4;
            transform: scale(1.1) rotate(-4deg);
        }

        /* ============================================================
           SUBMIT BUTTON
           ============================================================ */
        .submit-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #1a9b85, #08766c);
            color: white;
            font-size: 16px;
            font-weight: 700;
            font-family: "Inter", sans-serif;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(8, 127, 112, 0.30);
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: 0.3px;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: linear-gradient(135deg, #26b396, #0e8a7a);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 18px 50px rgba(8, 127, 112, 0.40);
        }

        .submit-btn:hover:not(:disabled)::before {
            opacity: 1;
        }

        .submit-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .submit-btn i,
        .submit-btn span {
            position: relative;
            z-index: 1;
        }

        .submit-btn i {
            font-size: 18px;
            transition: transform 0.3s ease;
        }

        .submit-btn:hover:not(:disabled) i {
            transform: rotate(-6deg) scale(1.1);
        }

        .submit-btn:disabled {
            background: rgba(255, 255, 255, 0.08);
            box-shadow: none;
            cursor: not-allowed;
            color: rgba(200, 230, 220, 0.40);
        }

        /* ============================================================
           MESSAGE
           ============================================================ */
        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            padding: 12px 16px;
            border-radius: 12px;
            transition: all 0.4s ease;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #message.success {
            color: #7eddb0;
            background: rgba(126, 221, 176, 0.06);
            border: 1px solid rgba(126, 221, 176, 0.06);
        }

        #message.error {
            color: #f87171;
            background: rgba(248, 113, 113, 0.06);
            border: 1px solid rgba(248, 113, 113, 0.06);
        }

        /* ============================================================
           DECORATIVE ELEMENTS
           ============================================================ */
        .form-box .deco-dot {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.04;
        }
        .form-box .deco-dot-1 {
            width: 120px;
            height: 120px;
            top: -40px;
            right: -40px;
            background: #7eddb0;
        }
        .form-box .deco-dot-2 {
            width: 80px;
            height: 80px;
            bottom: -20px;
            left: -20px;
            background: #4caf68;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 600px) {
            body {
                padding: 16px;
            }
            .form-box {
                padding: 30px 22px 28px;
                border-radius: 24px;
            }
            .form-header h1 {
                font-size: 26px;
            }
            .form-header .icon-wrap {
                width: 64px;
                height: 64px;
                font-size: 28px;
            }
            .form-group input {
                padding: 12px 14px;
                font-size: 13px;
            }
            .submit-btn {
                padding: 14px;
                font-size: 15px;
            }
            .photo-section {
                padding: 16px 12px;
            }
            #preview {
                width: 90px;
                height: 90px;
            }
            .form-box .deco-dot-1,
            .form-box .deco-dot-2 {
                display: none;
            }
        }

        @media (max-width: 400px) {
            .form-box {
                padding: 24px 16px 22px;
                border-radius: 20px;
            }
            .form-header h1 {
                font-size: 22px;
            }
            .form-header .icon-wrap {
                width: 56px;
                height: 56px;
                font-size: 24px;
            }
            .form-group input {
                padding: 10px 12px;
                font-size: 12px;
                border-radius: 12px;
            }
            .submit-btn {
                padding: 12px;
                font-size: 14px;
                border-radius: 12px;
            }
            #preview {
                width: 76px;
                height: 76px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .bg-wall .orb,
            .particle {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
            .form-box,
            .form-box * {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- ============================================================
    ANIMATED BACKGROUND
    ============================================================ -->
    <div class="bg-wall">
        <div class="bg-gradient"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="noise"></div>
    </div>

    <!-- Floating Particles -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- ============================================================
    FORM
    ============================================================ -->
    <div class="form-wrapper">

        <div class="form-box" id="formBox">

            <!-- Decorative dots -->
            <div class="deco-dot deco-dot-1"></div>
            <div class="deco-dot deco-dot-2"></div>

            <!-- Header -->
            <div class="form-header">
                <div class="icon-wrap">
                    <i class="fas fa-dna"></i>
                </div>
                <h1>Join <span>BioGenius</span></h1>
                <p class="subtitle">Become part of the biotechnology community</p>
            </div>

            <!-- Form -->
            <form id="memberForm">

                <!-- Photo Upload -->
                <div class="photo-section">
                    <span class="photo-label">
                        <i class="fas fa-camera"></i> Profile Photo
                    </span>
                    <div class="photo-upload-wrap">
                        <img id="preview" alt="Profile Preview">
                        <label class="photo-upload-btn" for="photo">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <span>Choose Photo</span>
                        </label>
                        <input type="file" id="photo" accept="image/png,image/jpeg,image/webp" required>
                        <span class="photo-hint">PNG, JPG · Max 2MB</span>
                    </div>
                </div>

                <!-- Name -->
                <div class="form-group">
                    <label for="name"><i class="fas fa-user"></i> Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="email" placeholder="Enter your university email" required>
                </div>

                <!-- Department -->
                <div class="form-group">
                    <label for="department"><i class="fas fa-graduation-cap"></i> Department / Branch</label>
                    <input type="text" id="department" placeholder="e.g. Biotechnology" required>
                </div>

                <!-- Year -->
                <div class="form-group">
                    <label for="year"><i class="fas fa-calendar-alt"></i> Year / Semester</label>
                    <input type="text" id="year" placeholder="e.g. 2nd Year" required>
                </div>

                <!-- Submit -->
                <button type="submit" class="submit-btn" id="registerBtn">
                    <i class="fas fa-leaf"></i>
                    <span>Register</span>
                </button>

                <div id="message"></div>

            </form>

        </div>

    </div>

    <!-- ============================================================
    FIREBASE + CLOUDINARY
    ============================================================ -->
    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

        // ============================
        // FIREBASE CONFIG
        // ============================
        const firebaseConfig = {
            apiKey: "AIzaSyCuYhCw8NdMB0Nu5p00L2HxOJfOCsEoHwo",
            authDomain: "biogenius-club.firebaseapp.com",
            projectId: "biogenius-club",
            storageBucket: "biogenius-club.firebasestorage.app",
            messagingSenderId: "32774064333",
            appId: "1:32774064333:web:cd43095a382f4949af8184"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ============================
        // CLOUDINARY SETTINGS
        // ============================
        const CLOUD_NAME = "jdada6qn";
        const UPLOAD_PRESET = "biogenius_members";

        // ============================
        // DOM ELEMENTS
        // ============================
        const form = document.getElementById("memberForm");
        const photoInput = document.getElementById("photo");
        const preview = document.getElementById("preview");
        const registerBtn = document.getElementById("registerBtn");
        const message = document.getElementById("message");

        // ============================
        // 3D TILT ON MOUSE MOVE
        // ============================
        const formBox = document.getElementById("formBox");

        formBox.addEventListener("mousemove", function(e) {
            const rect = this.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;
            this.style.setProperty("--mouse-x", x + "%");
            this.style.setProperty("--mouse-y", y + "%");

            // Subtle 3D tilt
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const deltaX = (e.clientX - centerX) / centerX;
            const deltaY = (e.clientY - centerY) / centerY;

            const rotateY = deltaX * 2.5;
            const rotateX = -deltaY * 2.5;

            this.style.transform =
                `rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-4px) scale(1.01)`;
        });

        formBox.addEventListener("mouseleave", function() {
            this.style.transform = "rotateX(0deg) rotateY(0deg) translateY(0px) scale(1)";
        });

        // ============================
        // PHOTO PREVIEW
        // ============================
        photoInput.addEventListener("change", function() {
            const file = this.files[0];
            if (!file) return;

            if (file.size > 2 * 1024 * 1024) {
                alert("Please select an image smaller than 2 MB.");
                this.value = "";
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.classList.add("show");
            };
            reader.readAsDataURL(file);
        });

        // ============================
        // FORM SUBMIT
        // ============================
        form.addEventListener("submit", async function(e) {
            e.preventDefault();

            const file = photoInput.files[0];
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const department = document.getElementById("department").value.trim();
            const year = document.getElementById("year").value.trim();

            if (!file) {
                message.textContent = "❌ Please select a profile photo.";
                message.className = "error";
                return;
            }

            try {
                registerBtn.disabled = true;
                registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Uploading...</span>';

                // ---- Upload to Cloudinary ----
                const cloudinaryData = new FormData();
                cloudinaryData.append("file", file);
                cloudinaryData.append("upload_preset", UPLOAD_PRESET);

                const uploadResponse = await fetch(
                    `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
                    { method: "POST", body: cloudinaryData }
                );

                if (!uploadResponse.ok) {
                    throw new Error("Photo upload failed.");
                }

                const uploadResult = await uploadResponse.json();
                const photoURL = uploadResult.secure_url;

                // ---- Save to Firestore ----
                registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Submitting...</span>';

                await addDoc(collection(db, "members"), {
                    name: name,
                    email: email,
                    department: department,
                    year: year,
                    photoURL: photoURL,
                    status: "pending",
                    createdAt: serverTimestamp()
                });

                // ---- Success ----
                message.textContent = "✅ Registration submitted! Waiting for admin approval.";
                message.className = "success";
                form.reset();
                preview.classList.remove("show");
                preview.src = "";

            } catch (error) {
                console.error(error);
                message.textContent = "❌ Something went wrong. Please try again.";
                message.className = "error";
            } finally {
                registerBtn.disabled = false;
                registerBtn.innerHTML = '<i class="fas fa-leaf"></i><span>Register</span>';
            }
        });

        console.log("✅ BioGenius — Registration page loaded with 3D effects!");
    </script>

</body>
</html>
