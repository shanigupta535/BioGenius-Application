<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioGenius Club | Admin Panel</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* ============================================================
           ROOT VARIABLES
           ============================================================ */
        :root {
            --primary: #087f70;
            --primary-dark: #065a4f;
            --primary-light: #0ea58f;
            --green: #4caf68;
            --green-light: #8fdc9b;
            --gold: #f0c040;
            --gold-light: #ffe066;
            --radius: 20px;
            --card-radius: 18px;
        }

        /* ============================================================
           RESET & BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            min-height: 100vh;
            background: #0a1a18;
            color: #ecfbf5;
            padding: 30px;
            position: relative;
            overflow-x: hidden;
        }

        /* ============================================================
           ANIMATED BACKGROUND
           ============================================================ */
        .bg-wall {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: #0a1a18;
        }
        .bg-wall .bg-gradient {
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(8, 127, 112, 0.25) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 80%, rgba(76, 175, 104, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(10, 30, 28, 0.95) 0%, #0a1a18 100%);
        }

        .bg-wall .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.20;
            pointer-events: none;
            animation: orbFloat 14s ease-in-out infinite alternate;
        }
        .bg-wall .orb-1 {
            width: 600px;
            height: 600px;
            top: -200px;
            right: -150px;
            background: rgba(8, 127, 112, 0.20);
            animation-delay: 0s;
        }
        .bg-wall .orb-2 {
            width: 500px;
            height: 500px;
            bottom: -150px;
            left: -100px;
            background: rgba(76, 175, 104, 0.12);
            animation-delay: 5s;
        }
        .bg-wall .orb-3 {
            width: 350px;
            height: 350px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(126, 221, 176, 0.04);
            animation-delay: 10s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, -50px) scale(1.05); }
            66% { transform: translate(-30px, 40px) scale(0.95); }
            100% { transform: translate(30px, 30px) scale(1.02); }
        }

        .bg-wall .noise {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            background-size: 300px 300px;
            opacity: 0.4;
            mix-blend-mode: overlay;
        }

        /* ============================================================
           FLOATING PARTICLES
           ============================================================ */
        .particles {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(126, 221, 176, 0.20);
            border-radius: 50%;
            animation: particleFloat 22s linear infinite;
        }
        .particle:nth-child(1) { left: 8%; animation-delay: 0s; width: 6px; height: 6px; }
        .particle:nth-child(2) { left: 18%; animation-delay: 2.5s; }
        .particle:nth-child(3) { left: 32%; animation-delay: 4.5s; width: 8px; height: 8px; opacity: 0.12; }
        .particle:nth-child(4) { left: 48%; animation-delay: 1.5s; }
        .particle:nth-child(5) { left: 62%; animation-delay: 3.5s; width: 5px; height: 5px; }
        .particle:nth-child(6) { left: 75%; animation-delay: 6s; width: 7px; height: 7px; opacity: 0.12; }
        .particle:nth-child(7) { left: 85%; animation-delay: 2s; }
        .particle:nth-child(8) { left: 42%; animation-delay: 7s; width: 9px; height: 9px; opacity: 0.08; }

        @keyframes particleFloat {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* ============================================================
           CONTAINER
           ============================================================ */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ============================================================
           HEADER — 3D CARD
           ============================================================ */
        .header-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(32px) saturate(1.4);
            -webkit-backdrop-filter: blur(32px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 28px;
            padding: 32px 40px;
            margin-bottom: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.40), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
            perspective: 800px;
            transform: rotateX(1deg) rotateY(-0.5deg);
        }

        .header-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 28px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(126, 221, 176, 0), rgba(126, 221, 176, 0.06), rgba(8, 127, 112, 0.10), rgba(126, 221, 176, 0.06), rgba(126, 221, 176, 0));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            transition: all 0.6s ease;
            opacity: 0.4;
        }

        .header-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 28px;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(126, 221, 176, 0.04), transparent 60%);
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }

        .header-card:hover::after {
            opacity: 1;
        }

        .header-card:hover {
            transform: rotateX(0deg) rotateY(0deg) translateY(-4px) scale(1.005);
            border-color: rgba(126, 221, 176, 0.10);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(126, 221, 176, 0.04);
        }

        .header-card:hover::before {
            opacity: 0.8;
            background: linear-gradient(135deg, rgba(126, 221, 176, 0.10), rgba(8, 127, 112, 0.15), rgba(126, 221, 176, 0.10));
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .header-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(8, 127, 112, 0.30), rgba(6, 90, 79, 0.20));
            border: 1px solid rgba(126, 221, 176, 0.10);
            display: grid;
            place-items: center;
            font-size: 26px;
            color: #7eddb0;
            transition: all 0.4s ease;
        }

        .header-card:hover .header-icon {
            transform: scale(1.06) rotate(-4deg);
            border-color: rgba(126, 221, 176, 0.20);
            box-shadow: 0 0 30px rgba(126, 221, 176, 0.06);
        }

        .header-left h1 {
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .header-left h1 span {
            color: #7eddb0;
        }

        .header-left p {
            color: rgba(200, 230, 220, 0.60);
            font-size: 14px;
            margin-top: 2px;
        }

        .header-stats {
            display: flex;
            gap: 30px;
        }

        .stat-item {
            text-align: center;
            padding: 8px 20px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.4s ease;
            min-width: 80px;
        }

        .stat-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(126, 221, 176, 0.08);
            transform: translateY(-2px);
        }

        .stat-item .number {
            font-size: 28px;
            font-weight: 800;
            color: #7eddb0;
            font-family: "Plus Jakarta Sans", sans-serif;
        }

        .stat-item .label {
            font-size: 11px;
            color: rgba(200, 230, 220, 0.50);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ============================================================
           SECTION TITLES
           ============================================================ */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .section-title {
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title i {
            color: #7eddb0;
            font-size: 20px;
        }

        .section-title .count-badge {
            display: inline-block;
            background: linear-gradient(135deg, #087f70, #065a4f);
            color: #b5f0d4;
            padding: 2px 14px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            border: 1px solid rgba(126, 221, 176, 0.10);
            min-width: 28px;
            text-align: center;
        }

        /* ============================================================
           MEMBERS GRID
           ============================================================ */
        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        /* ============================================================
           MEMBER CARD — 3D GLASS
           ============================================================ */
        .member-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px) saturate(1.3);
            -webkit-backdrop-filter: blur(20px) saturate(1.3);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--card-radius);
            padding: 24px 24px 20px;
            transition: all 0.45s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
            perspective: 600px;
            transform: rotateX(0.5deg) rotateY(0.3deg);
        }

        .member-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--card-radius);
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(126, 221, 176, 0.05), transparent 60%);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .member-card:hover::before {
            opacity: 1;
        }

        .member-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(126, 221, 176, 0.20), rgba(8, 127, 112, 0.30), rgba(126, 221, 176, 0.20), transparent);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .member-card:hover::after {
            opacity: 1;
        }

        .member-card:hover {
            transform: translateY(-8px) scale(1.01);
            border-color: rgba(126, 221, 176, 0.10);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(126, 221, 176, 0.04);
            background: rgba(255, 255, 255, 0.06);
        }

        .member-top {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 14px;
        }

        .member-photo {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            object-fit: cover;
            border: 2.5px solid rgba(126, 221, 176, 0.12);
            transition: all 0.5s ease;
            flex-shrink: 0;
        }

        .member-card:hover .member-photo {
            border-color: rgba(126, 221, 176, 0.30);
            transform: scale(1.04);
            box-shadow: 0 0 30px rgba(126, 221, 176, 0.06);
        }

        .member-name {
            font-size: 17px;
            font-weight: 700;
            color: #ecfbf5;
            transition: color 0.3s ease;
        }

        .member-card:hover .member-name {
            color: #b5f0d4;
        }

        .member-dept {
            font-size: 13px;
            color: rgba(200, 230, 220, 0.55);
            font-weight: 500;
        }

        .member-details {
            font-size: 13px;
            color: rgba(200, 230, 220, 0.60);
            line-height: 1.8;
            margin-bottom: 12px;
            padding: 10px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .member-details span {
            display: block;
        }

        .member-details i {
            color: #7eddb0;
            width: 20px;
            margin-right: 6px;
            font-size: 13px;
        }

        .member-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 4px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .status-badge.pending {
            background: rgba(255, 193, 7, 0.12);
            color: #ffc107;
            border: 1px solid rgba(255, 193, 7, 0.08);
        }

        .status-badge.pending i {
            color: #ffc107;
            font-size: 10px;
        }

        .status-badge.approved {
            background: rgba(76, 175, 104, 0.12);
            color: #4caf68;
            border: 1px solid rgba(76, 175, 104, 0.08);
        }

        .status-badge.approved i {
            color: #4caf68;
            font-size: 10px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: none;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
            font-family: "Inter", sans-serif;
            position: relative;
            overflow: hidden;
        }

        .btn i {
            font-size: 13px;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 10px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .btn:hover::before {
            opacity: 1;
        }

        .btn-approve {
            background: linear-gradient(135deg, #1a9b85, #08766c);
            color: white;
            box-shadow: 0 4px 15px rgba(8, 127, 112, 0.25);
        }

        .btn-approve:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 25px rgba(8, 127, 112, 0.35);
        }

        .btn-approve:active {
            transform: scale(0.96);
        }

        .btn-reject {
            background: rgba(220, 53, 69, 0.12);
            color: #f87171;
            border: 1px solid rgba(220, 53, 69, 0.08);
        }

        .btn-reject:hover {
            background: rgba(220, 53, 69, 0.20);
            transform: translateY(-2px);
            border-color: rgba(220, 53, 69, 0.15);
        }

        .btn-delete {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(200, 230, 220, 0.40);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .btn-delete:hover {
            background: rgba(220, 53, 69, 0.12);
            color: #f87171;
            border-color: rgba(220, 53, 69, 0.08);
            transform: translateY(-2px);
        }

        .btn-delete:active {
            transform: scale(0.96);
        }

        /* ============================================================
           EMPTY STATE
           ============================================================ */
        .empty-state {
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 50px 30px;
            text-align: center;
            color: rgba(200, 230, 220, 0.40);
            transition: all 0.4s ease;
        }

        .empty-state:hover {
            border-color: rgba(126, 221, 176, 0.06);
            background: rgba(255, 255, 255, 0.03);
        }

        .empty-state i {
            font-size: 48px;
            color: rgba(126, 221, 176, 0.10);
            margin-bottom: 16px;
            display: block;
        }

        .empty-state p {
            font-size: 15px;
        }

        /* ============================================================
           LOADING
           ============================================================ */
        .loading-state {
            text-align: center;
            padding: 40px;
            color: rgba(200, 230, 220, 0.40);
        }

        .loading-state i {
            font-size: 32px;
            color: #7eddb0;
            margin-bottom: 12px;
            display: block;
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 900px) {
            body {
                padding: 20px;
            }
            .header-card {
                flex-direction: column;
                align-items: flex-start;
                padding: 24px 28px;
            }
            .header-stats {
                width: 100%;
                justify-content: space-around;
            }
            .stat-item .number {
                font-size: 22px;
            }
            .members-grid {
                grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
                gap: 18px;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 14px;
            }
            .header-card {
                padding: 20px 18px;
                border-radius: 20px;
            }
            .header-left h1 {
                font-size: 22px;
            }
            .header-icon {
                width: 44px;
                height: 44px;
                font-size: 20px;
            }
            .header-stats {
                gap: 12px;
                flex-wrap: wrap;
            }
            .stat-item {
                padding: 6px 12px;
                min-width: 60px;
            }
            .stat-item .number {
                font-size: 18px;
            }
            .stat-item .label {
                font-size: 9px;
            }
            .members-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .member-card {
                padding: 18px 16px 16px;
            }
            .member-photo {
                width: 56px;
                height: 56px;
            }
            .member-name {
                font-size: 15px;
            }
            .section-title {
                font-size: 18px;
            }
            .btn {
                padding: 6px 12px;
                font-size: 11px;
            }
            .btn i {
                font-size: 11px;
            }
            .member-bottom {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .btn-group {
                justify-content: stretch;
            }
            .btn-group .btn {
                flex: 1;
                justify-content: center;
            }
        }

        @media (max-width: 400px) {
            .header-left {
                flex-wrap: wrap;
            }
            .header-stats {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .stat-item {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 8px 14px;
            }
            .stat-item .number {
                font-size: 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .bg-wall .orb,
            .particle {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
            .member-card,
            .header-card,
            .btn,
            .stat-item,
            .member-photo {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- ============================================================
    ANIMATED BACKGROUND
    ============================================================ -->
    <div class="bg-wall">
        <div class="bg-gradient"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="noise"></div>
    </div>

    <!-- Floating Particles -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- ============================================================
    MAIN CONTAINER
    ============================================================ -->
    <div class="container">

        <!-- ============================================================
        HEADER
        ============================================================ -->
        <div class="header-card" id="headerCard">
            <div class="header-left">
                <div class="header-icon">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <div>
                    <h1>Admin <span>Panel</span></h1>
                    <p><i class="fas fa-dna" style="color:#7eddb0;font-size:12px;margin-right:6px;"></i> BioGenius Club · Manage Members</p>
                </div>
            </div>
            <div class="header-stats">
                <div class="stat-item">
                    <div class="number" id="pendingCount">0</div>
                    <div class="label">Pending</div>
                </div>
                <div class="stat-item">
                    <div class="number" id="approvedCount">0</div>
                    <div class="label">Approved</div>
                </div>
                <div class="stat-item">
                    <div class="number" id="totalCount">0</div>
                    <div class="label">Total</div>
                </div>
            </div>
        </div>

        <!-- ============================================================
        PENDING MEMBERS
        ============================================================ -->
        <section style="margin-bottom: 40px;">

            <div class="section-header">
                <div class="section-title">
                    <i class="fas fa-clock"></i>
                    Pending Requests
                    <span class="count-badge" id="pendingBadge">0</span>
                </div>
            </div>

            <div id="pendingContainer" class="members-grid">
                <div class="loading-state">
                    <i class="fas fa-spinner"></i>
                    Loading registrations...
                </div>
            </div>

        </section>

        <!-- ============================================================
        APPROVED MEMBERS
        ============================================================ -->
        <section>

            <div class="section-header">
                <div class="section-title">
                    <i class="fas fa-user-check"></i>
                    Approved Members
                    <span class="count-badge" id="approvedBadge">0</span>
                </div>
            </div>

            <div id="approvedContainer" class="members-grid">
                <div class="loading-state">
                    <i class="fas fa-spinner"></i>
                    Loading members...
                </div>
            </div>

        </section>

    </div>

    <!-- ============================================================
    FIREBASE
    ============================================================ -->
    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import {
            getFirestore,
            collection,
            getDocs,
            doc,
            updateDoc,
            deleteDoc,
            onSnapshot,
            query,
            orderBy
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

        // =====================================
        // FIREBASE CONFIG
        // =====================================
        const firebaseConfig = {
            apiKey: "AIzaSyCuYhCw8NdMB0Nu5p00L2HxOJfOCsEoHwo",
            authDomain: "biogenius-club.firebaseapp.com",
            projectId: "biogenius-club",
            storageBucket: "biogenius-club.firebasestorage.app",
            messagingSenderId: "32774064333",
            appId: "1:32774064333:web:cd43095a382f4949af8184"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // =====================================
        // DOM REFS
        // =====================================
        const pendingContainer = document.getElementById("pendingContainer");
        const approvedContainer = document.getElementById("approvedContainer");
        const pendingBadge = document.getElementById("pendingBadge");
        const approvedBadge = document.getElementById("approvedBadge");
        const pendingCount = document.getElementById("pendingCount");
        const approvedCount = document.getElementById("approvedCount");
        const totalCount = document.getElementById("totalCount");

        // =====================================
        // 3D TILT ON HEADER
        // =====================================
        const headerCard = document.getElementById("headerCard");

        headerCard.addEventListener("mousemove", function(e) {
            const rect = this.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;
            this.style.setProperty("--mouse-x", x + "%");
            this.style.setProperty("--mouse-y", y + "%");

            // Subtle tilt
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const deltaX = (e.clientX - centerX) / centerX;
            const deltaY = (e.clientY - centerY) / centerY;

            const rotateY = deltaX * 1.5;
            const rotateX = -deltaY * 1.5;

            this.style.transform =
                `rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-3px) scale(1.005)`;
        });

        headerCard.addEventListener("mouseleave", function() {
            this.style.transform = "rotateX(0deg) rotateY(0deg) translateY(0px) scale(1)";
        });

        // =====================================
        // 3D TILT ON MEMBER CARDS (delegated)
        // =====================================
        document.addEventListener("mousemove", function(e) {
            document.querySelectorAll(".member-card").forEach(card => {
                const rect = card.getBoundingClientRect();
                if (e.clientX >= rect.left && e.clientX <= rect.right &&
                    e.clientY >= rect.top && e.clientY <= rect.bottom) {
                    const x = ((e.clientX - rect.left) / rect.width) * 100;
                    const y = ((e.clientY - rect.top) / rect.height) * 100;
                    card.style.setProperty("--mouse-x", x + "%");
                    card.style.setProperty("--mouse-y", y + "%");

                    const cx = rect.left + rect.width / 2;
                    const cy = rect.top + rect.height / 2;
                    const dx = (e.clientX - cx) / cx;
                    const dy = (e.clientY - cy) / cy;
                    card.style.transform =
                        `rotateX(${-dy * 1.2}deg) rotateY(${dx * 1.2}deg) translateY(-8px) scale(1.01)`;
                } else {
                    if (!card.matches(":hover")) {
                        card.style.transform = "rotateX(0deg) rotateY(0deg) translateY(0px) scale(1)";
                    }
                }
            });
        });

        // =====================================
        // RENDER FUNCTIONS
        // =====================================
        function renderPending(members) {
            if (members.length === 0) {
                pendingContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-check-circle"></i>
                        <p>🎉 All caught up! No pending requests.</p>
                    </div>
                `;
                return;
            }

            pendingContainer.innerHTML = members.map(m => `
                <div class="member-card" data-id="${m.id}">
                    <div class="member-top">
                        <img src="${m.photoURL || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(m.name) + '&background=087f70&color=fff'}" 
                             class="member-photo" alt="${m.name}">
                        <div>
                            <div class="member-name">${m.name}</div>
                            <div class="member-dept">${m.department || 'Department'}</div>
                        </div>
                    </div>
                    <div class="member-details">
                        <span><i class="fas fa-envelope"></i> ${m.email}</span>
                        <span><i class="fas fa-graduation-cap"></i> ${m.year || 'Year'}</span>
                    </div>
                    <div class="member-bottom">
                        <span class="status-badge pending"><i class="fas fa-circle"></i> Pending</span>
                        <div class="btn-group">
                            <button class="btn btn-approve" onclick="approveMember('${m.id}')">
                                <i class="fas fa-check"></i> Approve
                            </button>
                            <button class="btn btn-reject" onclick="rejectMember('${m.id}')">
                                <i class="fas fa-times"></i> Reject
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderApproved(members) {
            if (members.length === 0) {
                approvedContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-users"></i>
                        <p>No approved members yet.</p>
                    </div>
                `;
                return;
            }

            approvedContainer.innerHTML = members.map(m => `
                <div class="member-card" data-id="${m.id}">
                    <div class="member-top">
                        <img src="${m.photoURL || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(m.name) + '&background=087f70&color=fff'}" 
                             class="member-photo" alt="${m.name}">
                        <div>
                            <div class="member-name">${m.name}</div>
                            <div class="member-dept">${m.department || 'Department'}</div>
                        </div>
                    </div>
                    <div class="member-details">
                        <span><i class="fas fa-envelope"></i> ${m.email}</span>
                        <span><i class="fas fa-graduation-cap"></i> ${m.year || 'Year'}</span>
                    </div>
                    <div class="member-bottom">
                        <span class="status-badge approved"><i class="fas fa-circle"></i> Approved</span>
                        <div class="btn-group">
                            <button class="btn btn-delete" onclick="deleteMember('${m.id}')">
                                <i class="fas fa-trash-alt"></i> Delete
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateStats(pending, approved) {
            const total = pending.length + approved.length;
            pendingBadge.textContent = pending.length;
            approvedBadge.textContent = approved.length;
            pendingCount.textContent = pending.length;
            approvedCount.textContent = approved.length;
            totalCount.textContent = total;
        }

        // =====================================
        // LIVE LISTENER
        // =====================================
        const membersQuery = query(collection(db, "members"), orderBy("createdAt", "desc"));

        onSnapshot(membersQuery, (snapshot) => {
            const pending = [];
            const approved = [];

            snapshot.forEach(doc => {
                const data = doc.data();
                const member = { id: doc.id, ...data };
                if (data.status === "pending") {
                    pending.push(member);
                } else if (data.status === "approved") {
                    approved.push(member);
                }
            });

            renderPending(pending);
            renderApproved(approved);
            updateStats(pending, approved);

        }, (error) => {
            console.error("Firestore error:", error);
            pendingContainer.innerHTML = `
                <div class="empty-state" style="border-color:rgba(248,113,113,0.2);">
                    <i class="fas fa-exclamation-triangle" style="color:#f87171;opacity:0.5;"></i>
                    <p style="color:#f87171;">❌ Failed to load members. Check Firestore rules.</p>
                </div>
            `;
            approvedContainer.innerHTML = '';
        });

        // =====================================
        // ACTIONS (exposed to window)
        // =====================================
        window.approveMember = async function(id) {
            if (!confirm("✅ Approve this member?")) return;
            try {
                await updateDoc(doc(db, "members", id), { status: "approved" });
                // toast-style feedback via console
                console.log(`✅ Member ${id} approved`);
            } catch (error) {
                console.error(error);
                alert("❌ Failed to approve member.");
            }
        };

        window.rejectMember = async function(id) {
            if (!confirm("❌ Reject and delete this registration?")) return;
            try {
                await deleteDoc(doc(db, "members", id));
                console.log(`🗑 Member ${id} rejected`);
            } catch (error) {
                console.error(error);
                alert("❌ Failed to reject member.");
            }
        };

        window.deleteMember = async function(id) {
            if (!confirm("🗑 Are you sure you want to delete this member?")) return;
            try {
                await deleteDoc(doc(db, "members", id));
                console.log(`🗑 Member ${id} deleted`);
            } catch (error) {
                console.error(error);
                alert("❌ Failed to delete member.");
            }
        };

        console.log("✅ BioGenius — Admin Panel loaded with 3D effects!");
    </script>

</body>
</html>
